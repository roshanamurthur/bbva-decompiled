      static get observers() {
        return [
          '_getProductData(productId, productsList, customerId)',

      /**

      setOfferSimulate(isEditableAmount, _financialData, preventOfferSimulation) {

        if (isEditableAmount && financialDataAmounts && !preventOfferSimulation) {
          this.getOfferSimulate(financialDataAmounts);
        }
      }

      /**
       * Reset Method
       */
      reset() {
        this.productId = null;
        this.disableGetOffer = false;
        this.enableReviewNavigation = false;
        this.altOffer = false;
        this._financialData = {};
        this.detailDocumentPdfTemplate = {};
        this.grantedCredit = undefined;
        this.resetAttempts();
        this.set('configCountAttempts.counter', 0);
      }

      /**
       * Reset attempts in config object attempts
       */
      resetAttempts() {
        this.configAttempts = { counter: 0, maxAttempts: 3 };
      }

      /**
      * Method to compute customer email
      * @param {Array} customerContactsData Contact data received from request response
      */
      _getEmail(customerContactsData = []) {
        return customerContactsData.find((contact) =>
          contact.contactType && contact.isChecked && contact.contactType.id === 'EMAIL'
        );
      }

      /**
      * Reset lastAction propertie and close control veil
      */
      clearLastCall() {
        this.closeControlVeil();
        this.lastAction = null;
      }

      /**
      * Checks if put card limit request has been saved in this.lastAction to retry
      */
      retryPutCardLimit() {
        this.configAttempts.counter++;
        if (this.lastAction) {
          if (this.isDecrease) {
            if (this.configAttempts.counter <= this.configAttempts.maxAttempts) {
              this.lastAction.fn(this.lastAction.data);
            }
          } else {
            this.lastAction.fn(this.lastAction.data);
          }
        } else {
          this.closeControlVeil();
        }
      }

      /**
      * Retry put card limit request using reference saved in this.lastAction
      * @param {Object} required request data
      */
      incrementPutClickedRecall(_dataForm) {
        if (!this.isDecrease) {
          if (
            _dataForm &&
            (this.amountsArrayValid && this.c(_dataForm, 'amounts'))

            const currency = _dataForm.amounts[0].currency;
            _dataForm.amounts = this._getAmountsArray(this._financialData.amounts, currency);

            _dataForm.amount = this.sendInputValue
              ? _dataForm.amount
              : this._financialData.amounts.suggestedAmount || this._financialData.amounts.minAmount;
          }
        }
        this.incrementPutClicked(_dataForm);
        this.lastAction = {
          fn: this.incrementPutClicked.bind(this),
          data: _dataForm
        };
      }

      /**
       * Create an array of amounts (minAmount, suggestedAmount and maxAmount in that order)
       * @param {Array} amounts
       * @param {String} localCurrency
       */
      _getAmountsArray(amounts, localCurrency) {
        return this.altOffer ? [
          { amount: this.c(amounts, 'grantedCredit'), currency: localCurrency },
          { amount: this.c(amounts, 'diffAmount'), currency: localCurrency },
          { amount: this.c(amounts, 'suggestedAmount'), currency: localCurrency },
        ] : [
          { amount: this.c(amounts, 'minAmount'), currency: localCurrency },
          { amount: this.c(amounts, 'suggestedAmount'), currency: localCurrency },
          { amount: this.c(amounts, 'maxAmount'), currency: localCurrency }
        ];
      }

      * @param {Object} required request data
      */

          this.setNative(!this.isIosNative);
        }
        if (
          _dataForm &&
          ((this.amountsArrayValid && _dataForm.amounts) || (_dataForm.amount && _dataForm.currency)) &&
          _dataForm.limitId
        ) {
          if (!this.amountsArrayValid) {
            Object.assign(this._financialData, _dataForm);
          }
          this.enableReviewNavigation = true;
          this.openControlVeil();
          this._dispatchCustomEvent('increment-put-limit-validated', _dataForm);
          this._dispatchCustomEvent('hide-oc-banner', true);
        } else {
          this.closeControlVeil();
          if (this.isDecrease) {
            this.modalPutLimitsCardErrorDecrement({});
          } else {
            this.modalPutLimitsCardError();
          }
        }

      * @return {Object} parsed response data
      */

        const currency = this.get('_financialData.product.currency');
        const language = this.get('language');
        const amountPrevious = this.amountsArrayValid ? this.get('_financialData.amounts.minAmount') : this.get('_financialData.product.secondaryAmount');
        const formatedAmount = this.getFormattedAmount(amountPrevious, currency, currency, language, true, true, true);
        const chargeAmountResponse = this.isFlexibleLine ? this.c(this._financialData, 'amounts.suggestedAmount') : (this.amountsArrayValid ? this.c(this._financialData, 'amounts.maxAmount') : this.c(this._financialData, 'amount'));
        const parsedResponse = {
          id: '123',
          date: this._financialData.operationDate,
          title: 'glomo-increment-success-header-title',
          origin: {

          },
          amountLabel: '',
          chargeAmount: {

          },
          topInfo: [

            },
            {
              musk: {
                value: this.c(this._financialData, 'product.number'),

                simbol: '•'
              },
              class: 'spacing'
            },
            this._financialData.operationNumber ? {
              key: 'cells-successful-response-increment-folio',
              value: this.c(this._financialData, 'operationNumber'),
              class: 'bold spacing'
            } : undefined,
            {
              key: 'cells-successful-response-increment-email',
              value: this.c(this._financialData, 'contact.value'),
              class: 'bold secondary spacing'
            }
          ],
          buttons: {
            primary: {
              text: 'cells-successful-response-next',
              action: 'go-to-next'
            },

      errorBasePdf() {

      _goToProfile() {

      modalCloseOperativeConfirm() {

          onCancelDetail: {}
        });

      modalCustomerContactsError(data) {

      /**
       * Create event for glomo-alert-manager
       * @param {Object}
       *  className = 'error',
       *  closeOnPrimaryButton = true,
       *  icon = 'coronita:alert',
       *  iconOnlyFullHeight = true,
       *  message,
       *  onCancelDetail,
       *  openMaximized = false,
       *  type,
       */
      _openModal({
        className = 'error',
        closeOnPrimaryButton = true,
        icon = 'coronita:alert',
        iconOnlyFullHeight = true,
        message,
        onAcceptDetail,
        onCancelDetail,
        openMaximized = false,
        type,
        time = 0,
        heroImage = '',
        title = ''
      } = {}) {
        let eventName = 'increment-confirm-modal';
        let classTitle = 'strong';
        let classMsg = this.isIosNative ? 'spacing ' : '';
        let flow = 'INCREMENT-CARD-LIMIT';
        if (this.isDecrease) {
          eventName = 'decrement-confirm-modal';
          classTitle = 'title-paragraph-decrement';
          classMsg += 'subtitle-paragraph-decrement';
          flow = 'DECREMENT-CARD-LIMIT';
        }
        const CODE = `${type}-${flow}`;
        const detail = {
          code: CODE,
          time,
          selectedConfig: {
            className,
            closeOnPrimaryButton,
            iconOnlyFullHeight,
            openMaximized,
            title,
            heroImage,
            template: {
              type: 'paragraphs',
              values: [
                {
                  icon,
                  class: 'spacing'
                },
                this._setTitleForModal(message, CODE, classTitle),
                {
                  text: message || `alert-${CODE}-message`,
                  class: classMsg
                }
              ]
            }
          }
        };
        if (this.showExitTitle) {
          detail.selectedConfig.template.values[1].text = '';
        }
        if (onAcceptDetail) {
          detail.selectedConfig.acceptBtLabel = `alert-${CODE}-accept`;
          detail.selectedConfig.onAcceptDetail = onAcceptDetail;
        }
        if (onCancelDetail) {
          if (type !== 'SIMULATION-ERROR-EXIT') {
            detail.selectedConfig.cancelBtLabel = `alert-${CODE}-cancel`;
            detail.selectedConfig.onCancelDetail = onCancelDetail;
          }
        }
        this._dispatchCustomEvent(eventName, detail);
      }

      /**
       * function that returns correct object when it is decrement or not
       * @param {String} message
       * @param {String} CODE
       * @param {String} classTitle
       * @returns object
       */
      _setTitleForModal(message, CODE, classTitle) {
        const value = message || `alert-${CODE}-title`;
        return Object.assign({class: classTitle}, this.isDecrease ? {title: value} : {text: value});
      }

      /**
      * Dispatch custom event
      * @param {String} eventName custom event name
      * @param {Object} detail payload
      * @param {Boolean} bubbles event bubbles up through the DOM
      * @param {object} composed event can pass through the shadow boundary
      */
      _dispatchCustomEvent(eventName, detail, bubbles = true, composed = true) {
        this.dispatchEvent(new CustomEvent(eventName, { detail, bubbles, composed }));
      }

      retryOperationrequest(data) {
        if (data.errorType === 'error-on-get-card-offer-detail' || data.errorType === 'customer-email-data-error') {
          this._dispatchCustomEvent('get-offer-detail', this._setRequestAlternativeDetail(this.setAdditionalData));
        } else if (data.errorType === 'error-on-get-customer-contacts') {
          this._dispatchCustomEvent('get-customer-contact', {
            'customer-id': this.customerId
          });
        }
      }

      /**
       * Call the service (getOfferSimulate) again if there was an error previously
       */
      retryGetOfferSimulate(data) {
        if (this.c(data, 'suggestedAmount') && !this.preventOfferSimulation) {
          this.getOfferSimulate(data);
        }
      }

      setOfferDetailData(data) {
        if (data && data.details) {
          if (this.isFlexibleLine) {
            this._financialData.amounts = {
              maxAmount: this.grantedCredit ? this.grantedCredit + this.c(data, 'details.maximumAmount.0.amount') : this.c(data, 'details.maximumAmount.0.amount'),
              minAmount: this.grantedCredit ? this.grantedCredit + this.c(data, 'details.minimumAmount.0.amount') : this.c(data, 'details.minimumAmount.0.amount'),
              suggestedAmount: this.grantedCredit ? this.grantedCredit + this.c(data, 'details.suggestedAmount.0.amount') : this.c(data, 'details.suggestedAmount.0.amount'),
              grantedCredit: this.c(data, 'details.grantedCredit.0.amount') || this.grantedCredit,
              diffAmount: this.c(data, 'details.diffAmount.0.amount') || this.c(data, 'details.suggestedAmount.0.amount') - this.grantedCredit
            };
          } else {
            this._financialData.amounts = {
              maxAmount: data.details.maximumAmount[0].amount,
              minAmount: data.details.minimumAmount[0].amount,
              suggestedAmount: data.details.suggestedAmount[0].amount
            };
          }
          this._financialData.calculationDate = this.c(data, 'rates.0.calculationDate');
          this.isEditableAmount = !this.c(data, 'isEditable');
          this._detailDataSimulate();
          this._dispatchCustomEvent('set-increment-offer-operation-data', this._financialData);
          this.disableGetOffer = true;
          this._additionalConfigData(data);
        } else {
          this.modalInitDataError();
        }
      }

      /**
       * Validate productId, offerId, isEditableAmount, and preventOfferSimulation to run the simulation
       * @param {Object} data
       */
      _detailDataSimulate() {
        if (this.productId && this.offerId && this.isEditableAmount && !this.preventOfferSimulation) {
          this.getOfferSimulate(this.c(this._financialData, 'amounts'));
        }
      }

      /**
       * Validate getAdditionalData to set additional configuration
       * @param {Object} data
       */
      _additionalConfigData(data) {
        if (this.setAdditionalData) {
          this._setAdditionalConfig(data);
        }
      }

      setCustomerContact(data) {
        const contactData = this._getEmail(data);
        if (contactData) {
          this._financialData.contact = { isChecked: contactData.isChecked, value: contactData.contact };
          if (!this.disableGetOffer) {
            this._dispatchCustomEvent('get-offer-detail', this._setRequestAlternativeDetail(this.setAdditionalData));
          }
        } else {
          this.modalCustomerContactsError('customer-email-data-error');
        }
      }

      /**
       * Method that queries the simulate service
       */
      executionValidation(param) {
        this.dataForm = param;
        if (Object.entries(this.dataForm).length && !this.isEditableAmount) {
          const suggestedAmount = {
            suggestedAmount: this.c(param, 'amounts.1.amount'),
          };
          this.getOfferSimulate(suggestedAmount);
        } else {
          this.incrementPutClicked(this.dataForm);
        }
      }

      /**
       * get offer Simulations
       * @param {Object} amounts
       */
      getOfferSimulate(amounts) {
        const amountComputed = this.c(amounts, 'suggestedAmount');
        if (amountComputed && this.productId && this.offerId) {
          this.openControlVeil();
          this._dispatchCustomEvent('send-properties-to-service', { cardId: this.productId, offerId: this.offerId });
          const body = {
            offerType: {
              id: 'CREDIT_LIMIT_INCREASE'
            },
            requestedAmount: {
              amount: amountComputed,
              currency: this.localCurrency
            },
            total: {
              amount: amountComputed,
              currency: this.localCurrency
            },
            rates: [ {
              rateType: {
                id: 'TASA ANUAL',
                name: 'TASA ANUAL'
              },
              calculationDate: this._financialData.calculationDate,
              mode: {
                id: 'PERCENTAGE'
              },
              unit: {
                percentage: 0
              }
            } ],
            terms: {
              number: 0,
              frequency: 'MONTHLY'
            },
            fees: {
              itemizeFees: [ {
                feeType: 'SPECIFIC_TRANSACTION',
                name: 'Specific transaction',
                mode: {
                  id: 'PERCENTAGE',
                  name: 'Percentage'
                },
                itemizeFeeUnit: {
                  percentage: 0
                }
              } ]
            }
          };
          this._dispatchCustomEvent('get-offer-simulate-service', body);
        }
      }

      /**
       * get offer simulate error modal
         */
      getOfferSimulateError() {
        this.closeControlVeil();
        const modalOffer = this.c(this.configCountAttempts, 'counter', 0) < this.c(this.configCountAttempts, 'maxAttempts');
        this.configCountAttempts.counter++;
        const type = `SIMULATION-ERROR${modalOffer ? '' : '-EXIT'}`;
        const onAcceptDetail = modalOffer ? this.c(this._financialData, 'amounts') : {};
        this._openModal({
          type,
          onAcceptDetail,
          onCancelDetail: {},
          time: 1000
        });
      }

      /**
       * Show spinner when envocate the simulation getOfferSimulate service
       */
      succesSimulationService() {
        this.closeControlVeil();
        if (!this.isEditableAmount) {
          this.incrementPutClicked(this.dataForm);
        }
      }

      /**
       * Set product id
       * @param {Array} offerEvent
       */
      setCardsProducts(cards) {
        this.productsList = cards;
      }

      /**
       * Set product id
       * @param {Object} offerEvent
       */
      setProductId(offerEvent) {
        this.productId = offerEvent.productId;
      }

      /**
       * Get product card
       * @return {Object} card
       */
      getProductCard() {
        let card = [];
        let savedCards = [];
        this.productsList.forEach(data => {
          savedCards.push(...data.products || [ data ]);
        });
        savedCards.filter(products => {
          if (products.cardId === this.productId || products.id === this.productId) {
            card = products;
          }
        });
        return card;
      }

      /**
      * Receive customer id, product selected id & user product list from dashboard & get customer detail data
      */
      _getProductData() {
        if (!this.productsList?.length) {
          this._dispatchCustomEvent('get-product-list', {expand: 'related-contracts,participants,activations'});
          return;
        }
        this.customerId = this.customerId || this.c(this.globalCacheStorage, 'customer.customerId');
        if (this._validatedDataProduct()) {
          const productSelected = this.getProductCard();
          if (productSelected.length === 0) {
            this.modalInitDataError();
            return;
          } else {
            this._setFinancialData(productSelected);
            const imgSrc = this.c(productSelected, 'imgSrc', this.setAdditionalData ? './images/cards/cardFrontDefault.png' : '');
            const image = this.c(productSelected, 'detail.images.0.url') || imgSrc;
            this.set('_financialData.product', {...this._financialData.product, image});
            this.set('_financialData.product', {...this._financialData.product, imgSrc});
            this._dispatchCustomEvent('set-financial-data', this._financialData.product);
            this._dispatchCustomEvent('get-customer-contact', {
              'customer-id': this.customerId
            });
          }
        }
      }

      /**
       * verify that all the data is correct in order to continue with the data request.
       * @return {Boolean}
       */
      _validatedDataProduct() {
        return this.productId && this.productId !== 'undefined' && this.productsList && this.customerId && !this.enableReviewNavigation && !this._appComplete;
      }

      /**
       * Set _financialData with the selected product
       * @param {Object} productSelected
       */
      _setFinancialData(productSelected) {
        this._financialData.product = {
          number: this.c(productSelected, 'description', {}).value || this.c(productSelected, 'number', 0),
          name: this.c(productSelected, 'product.name', '') || this.c(productSelected, 'title.name', ''),
          primaryAmount: this.c(productSelected, 'primaryAmount', {}).amount ?? productSelected?.availableBalance?.currentBalances[0]?.amount ?? 0,
          secondaryAmount: this.c(productSelected, 'secondaryAmount', {}).amount ?? productSelected?.disposedBalance?.currentBalances[0]?.amount ?? 0,
          currency: this.c(productSelected, 'primaryAmount', {}).currency ?? productSelected?.availableBalance?.currentBalances[0]?.currency ?? 'MXN',
          limitId: this.amountsArrayValid ? 'MAXIMUM_LIMIT' : 'GRANTED_CREDITS',
          id: this.c(productSelected, 'id') || this.c(productSelected, 'cardId'),
          titleId: this.c(this.product, 'title.id', this.c(this.product, 'product.id')),
          subproductId: this.get('product.id', productSelected)
        };
      }

      /**
       * Set alternative request detail params
       * @param {*} setAdditionalData
       */
      _setRequestAlternativeDetail(setAdditionalData) {
        return setAdditionalData ? { offerId: this.offerId, cardId: this.productId } : {};
      }
      /**
       * set additional configuration
       */
      _setAdditionalConfig(data) {
        const cat = this.c(data, 'rates.0.unit.percentage');
        const startDate = this.c(data, 'rates.0.calculationDate');
        const endDate = this.c(data, 'rates.0.endDate');
        const textValidity = endDate ? `this.t(cells-credit-line-increase-end-date-description) ${moment(endDate).format('LL')}` : '';
        const textList = `${this.t('cells-credit-line-increase-cat-info')} ${cat}% ${this.t('cells-credit-line-increase-start-date-description')} ${moment(startDate).format('LL')}. ${textValidity}`;
        const hintList = 'hind-list-text-mx-1';
        const currency = this.get('_financialData.product.currency');
        const language = this.get('language');
        const previousAmount = this.amountsArrayValid ? this.get('_financialData.amounts.minAmount') : this.get('_financialData.product.secondaryAmount');
        const currentAmountOffer = this.getFormattedAmount(previousAmount, currency, currency, language, true, true, true);
        const suggestedAmount = this.amountsArrayValid ? this.get('_financialData.amounts.maxAmount') : this.get('_financialData.product.suggestedAmount');
        const diffCurrentAmount = this.getFormattedAmount(suggestedAmount - previousAmount, currency, currency, language, true, true, true);

          _contentWrapperClass: 'content-wrapper',

          optionalHeadingSubtitle: '',
          headingTextKeepInMind: '',
          contact: { isChecked: true, value: '' },
          skeletonClass: '',
          currencyCode: '$',
          listItemEdit: true,
          skeleton: false,
          maskChar: '•',
          showCardCover: true,
          classContent: 'content-justified-text',
          hiddenIconMessageAmount: true,
          messageWithLink: {
